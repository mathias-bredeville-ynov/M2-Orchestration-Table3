services:

  vault-agent:
    build:
      context: ./vault-agent
      dockerfile: Dockerfile

    container_name: vault-agent
    restart: unless-stopped

    environment:
      VAULT_ROLE_ID: "${VAULT_ROLE_ID}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID}"

    volumes:
      - vault-secrets:/vault/secrets

    networks:
      - nextcloud-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /vault/secrets/db_password && test -s /vault/secrets/db_root_password && test -s /vault/secrets/nextcloud_admin_password"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s


  db:
    image: mariadb:11
    container_name: nextcloud-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud

      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_password

    volumes:
      - db_data:/var/lib/mysql
      - vault-secrets:/run/secrets:ro

    networks:
      - nextcloud-net

    depends_on:
      vault-agent:
        condition: service_healthy


  nextcloud:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nextcloud
    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD_FILE: /run/secrets/db_password

      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud_admin_password

      NEXTCLOUD_TRUSTED_DOMAINS: "site.local 51.161.57.87"

    volumes:
      - nextcloud_data:/var/www/html
      - vault-secrets:/run/secrets:ro

    networks:
      - nextcloud-net

    depends_on:
      vault-agent:
        condition: service_healthy
      db:
        condition: service_started


networks:
  nextcloud-net:
    driver: bridge


volumes:
  db_data:
  nextcloud_data:
  vault-secrets:
