name: Docker Build and Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t nextcloud-custom:latest .

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Scan image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            nextcloud-custom:latest
