name: Workflow CI/CD Mathis Dubaille

on:
  push:
    branches: [ "main", "Mathis-Nextcloud" ]

jobs:
  ci-cd-pipeline:
    runs-on: self-hosted

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.VAULT_MD_ADDR }}
          method: token
          token: ${{ secrets.VAULT_MD_TOKEN }}
          secrets: |
            secret/data/nextcloud POSTGRES_PASSWORD | DB_PASSWORD ;
            secret/data/nextcloud NEXTCLOUD_ADMIN_PASSWORD | ADMIN_PASSWORD ;
            secret/data/nextcloud VPS_HOST | VPS_HOST ;
            secret/data/nextcloud VPS_ID | VPS_USERNAME ;
            secret/data/nextcloud VPS_SSH_KEY | VPS_SSH_KEY

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image locale
        uses: docker/build-push-action@v5
        with:
          context: ./V1
          load: true
          tags: nextcloud-custom:latest

      - name: Scan de vulnérabilités Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nextcloud-custom:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Déploiement sur le VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECURE_DB_PASS: ${{ env.DB_PASSWORD }}
          SECURE_ADMIN_PASS: ${{ env.ADMIN_PASSWORD }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          envs: SECURE_DB_PASS,SECURE_ADMIN_PASS
          script: |
            docker --version || exit 1
            docker compose version || exit 1
            
            cd /home/${{ env.VPS_USERNAME }}/M2-Orchestration-Table3/V1
            git pull origin Mathis-Nextcloud
            
            echo "POSTGRES_DB=nextclouddb" > .env
            echo "POSTGRES_USER=nextclouduser" >> .env
            echo "POSTGRES_PASSWORD=$SECURE_DB_PASS" >> .env
            echo "NEXTCLOUD_ADMIN_USER=admin" >> .env
            echo "NEXTCLOUD_ADMIN_PASSWORD=$SECURE_ADMIN_PASS" >> .env
            echo "NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1 nextcloud.mondomaine.fr" >> .env
            
            docker compose down
            docker compose up --build -d