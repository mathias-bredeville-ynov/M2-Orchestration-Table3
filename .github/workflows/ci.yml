name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # actions épinglées par SHA (cf. compromission trivy-action, mars 2026)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build
        run: docker build -t proxy:${{ github.sha }} ./proxy

      - name: Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: proxy:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push sur GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/proxy:sha-${GITHUB_SHA::7}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag proxy:${{ github.sha }} $IMAGE
          docker push $IMAGE

  compose-up:
    runs-on: ubuntu-latest
    needs: build-scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: docker compose up --build
        run: |
          cp .env.example .env
          ./scripts/init-secrets.sh
          docker compose up -d --build

      - name: Nextcloud répond en HTTPS
        run: |
          for i in $(seq 1 60); do
            curl -fsk https://localhost:8443/status.php | grep -q '"installed":true' && exit 0
            sleep 5
          done
          docker compose logs --tail=50
          exit 1
