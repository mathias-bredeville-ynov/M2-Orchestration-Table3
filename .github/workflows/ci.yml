name: CI

on:
  push:
    branches: [Mathias-Nextcloud]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        image: ["caddy:2-alpine", "nextcloud:33-apache", "mariadb:11.4"]
    steps:
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  deploy:
    runs-on: [self-hosted, nextcloud-vm]
    needs: scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          url: http://127.0.0.1:8200
          token: ${{ secrets.VAULT_AZURE_MATHIAS }}
          secrets: |
            secret/data/nextcloud db_root_password | DB_ROOT_PASSWORD ;
            secret/data/nextcloud db_password | DB_PASSWORD ;
            secret/data/nextcloud admin_password | ADMIN_PASSWORD ;
            secret/data/nextcloud domain | NEXTCLOUD_DOMAIN ;
            secret/data/nextcloud bind_ip | BIND_IP

      - run: docker compose up -d