name: Workflow CI-CD Mathis Dubaille

on:
  push:
    branches:
      - Mathis-Nextcloud

jobs:
  ci-cd-pipeline:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.VAULT_MD_ADDR }}
          method: token
          token: ${{ secrets.VAULT_MD_TOKEN }}
          secrets: |
            secret/data/SecretTP POSTGRES_PASSWORD | DB_PASSWORD ;
            secret/data/SecretTP NEXTCLOUD_ADMIN_PASSWORD | ADMIN_PASSWORD ;
            secret/data/SecretTP VPS_HOST | VPS_HOST ;
            secret/data/SecretTP VPS_ID | VPS_USERNAME ;
            secret/data/SecretTP VPS_SSH_KEY | VPS_SSH_KEY
        
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./V1
          load: true
          tags: nextcloud-custom:latest

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nextcloud-custom:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECURE_DB_PASS: ${{ env.DB_PASSWORD }}
          SECURE_ADMIN_PASS: ${{ env.ADMIN_PASSWORD }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          envs: SECURE_DB_PASS,SECURE_ADMIN_PASS
          script: |
            echo "=== CD : Vérification installation Docker ==="
            docker --version || { echo "Docker n'est pas installé"; exit 1; }
            docker compose version || { echo "Docker Compose n'est pas installé"; exit 1; }
            
            echo "=== 6. CD : Déploiement du docker-compose.yml ==="
            # 1. Se placer à la racine du dépôt
            cd /home/${{ env.VPS_USERNAME }}/M2-Orchestration-Table3
            
            # 2. Récupérer les branches et forcer le basculement sur Mathis-Nextcloud
            git fetch origin
            git checkout Mathis-Nextcloud
            git pull origin Mathis-Nextcloud
            
            # 3. Entrer dans le dossier V1 (qui est maintenant présent)
            cd V1
            
            # Injection sécurisée des secrets Vault dans le fichier .env sur le VPS
            echo "POSTGRES_DB=nextclouddb" > .env
            echo "POSTGRES_USER=nextclouduser" >> .env
            echo "POSTGRES_PASSWORD=$SECURE_DB_PASS" >> .env
            echo "NEXTCLOUD_ADMIN_USER=admin" >> .env
            echo "NEXTCLOUD_ADMIN_PASSWORD=$SECURE_ADMIN_PASS" >> .env
            echo "NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1 nextcloud.mondomaine.fr" >> .env
            
            # Re-déploiement propre de la stack
            docker compose down
            docker compose up --build -d
            
            echo "=== CD : Vérification des healthcheck ==="
            sleep 10
            docker compose ps
            if [ $(docker compose ps -q | xargs -r docker inspect -f '{{ .State.Status }}' | grep -c "exited") -gt 0 ]; then
              echo "Erreur : Un ou plusieurs conteneurs ne tournent pas correctement."
              exit 1
            fi
            echo "Tous les conteneurs sont up and running !"