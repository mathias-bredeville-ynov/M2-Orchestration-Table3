name: CI/CD Nextcloud

on:
  push:
    branches:
      - Rémi-Nextcloud

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t nextcloud-app .

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nextcloud-app'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: SSH Deploy & Healthcheck
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            command -v docker || exit 1
            cd /path/to/nextcloud
            docker compose pull
            docker compose up -d
            docker inspect --format='{{json .State.Health.Status}}' nextcloud-app | grep -q "healthy" || exit 1