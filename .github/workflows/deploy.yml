name: CI/CD Nextcloud

on:
  push:
    branches:
      - Rémi-Nextcloud

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull Nextcloud image
        run: docker pull nextcloud:latest

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nextcloud:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: SSH Deploy & Healthcheck
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            command -v docker || exit 1
            mkdir -p ~/nextcloud
            cd ~/nextcloud
            docker run -d --name nextcloud-app -p 8080:80 nextcloud:latest || docker restart nextcloud-app
            sleep 5
            docker ps | grep -q "nextcloud-app" || exit 1