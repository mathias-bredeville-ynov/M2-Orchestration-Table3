services:
  vault:
    image: hashicorp/vault:2.1
    restart: unless-stopped
    command: server
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      SKIP_SETCAP: "true"
    volumes:
      - ./config.hcl:/vault/config/config.hcl:ro
      - vault_data:/vault/file
    security_opt: [no-new-privileges:true]

volumes:
  vault_data: